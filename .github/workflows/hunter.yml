name: Deal Hunter

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل الوكيل
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python hunter.py

      - name: حفظ النتائج Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "تحديث العروض تلقائياً" || echo "لا توجد تغييرات"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "${{ github.ref_name }}"; then
              echo "تم الرفع بنجاح"
              exit 0
            fi
            echo "محاولة رقم $i لم تنجح، سأعيد المحاولة..."
            sleep 6
          done
          echo "تعذّر الرفع"
          exit 1
